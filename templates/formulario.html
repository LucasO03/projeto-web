<!DOCTYPE html>
<html lang="pt-BR">

<body>
    <h1>Calculadora</h1>
    <form action="" method="post">
        <label for="nome">Digite seu nome:</label>
        <input type="text" name="nome" id="nome">
        <br><br>
        <label for="nro1">Digite o primeiro numero:</label>
        <input type="number" name="nro1" id="nro1">
        <br>
        <label for="nro2">Digite o segundo numero:</label>
        <input type="number" step="0.01" name="nro2" id="nro2">
        <br><br>
        <button type="submit">Calcular</button>
    </form>

</body>

</html>
